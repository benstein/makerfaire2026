<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maker Faire 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff0f5; }
    #game-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas {
      flex: 3;
      min-width: 0;
      display: block;
      background: #ffe0f0;
    }
    #changelog-panel {
      flex: 1;
      background: linear-gradient(180deg, #fff0f8, #f0e0ff, #e8f0ff);
      padding: 20px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      color: #886;
      display: flex;
      flex-direction: column;
    }
    #changelog-entries { flex: 1; }
    #controls-help {
      border-top: 1px solid #f0c0d8;
      padding-top: 16px;
      margin-top: 16px;
      font-size: 13px;
      color: #b088a0;
      line-height: 1.8;
    }
    #controls-help h3 {
      color: #ff69b4;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    #controls-help .control-row {
      display: flex;
      justify-content: space-between;
    }
    #controls-help .control-key {
      color: #c070a0;
      font-weight: bold;
    }
    #changelog-panel h2 {
      color: #ff69b4;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .changelog-entry {
      border-left: 3px solid #ffb6c1;
      padding-left: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .changelog-entry .version { color: #ff69b4; font-weight: bold; }
    .changelog-entry .name { color: #b088c0; }
    .changelog-entry .desc { color: #887; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="changelog-panel">
      <h2>Changelog</h2>
      <div id="changelog-entries"></div>
      <div id="controls-help">
        <h3>Controls</h3>
        <div class="control-row"><span>Move</span><span class="control-key">Left Stick / WASD</span></div>
        <div class="control-row"><span>Fire</span><span class="control-key">A Button / Space</span></div>
        <div class="control-row"><span>Restart</span><span class="control-key">Start / Enter</span></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>

  <!-- Build overlay: independent of Vite modules, survives HMR and syntax errors -->
  <div id="build-overlay" style="display:none">
    <div class="build-bg"></div>
    <div class="build-content">
      <div id="build-name" class="build-title"></div>
      <div id="build-desc" class="build-desc"></div>
      <div class="build-gear-wrap"><div class="build-gear"></div></div>
      <div id="build-steps" class="build-steps"></div>
      <div class="build-bar-wrap">
        <div id="build-bar" class="build-bar"></div>
      </div>
      <div id="build-pct" class="build-pct"></div>
    </div>
  </div>
  <style>
    #build-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 999999;
      font-family: 'Courier New', monospace;
    }
    #build-overlay .build-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #ffe0f0, #ffd0e8, #ffe8d0, #ffffd0, #d0ffd8, #d0e8ff, #e8d0ff, #ffd0f0);
      background-size: 400% 400%;
      animation: build-bg-shift 8s ease infinite;
    }
    @keyframes build-bg-shift {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    #build-overlay .build-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px;
    }
    #build-overlay .build-title {
      font-size: 44px;
      font-weight: bold;
      color: #ff69b4;
      text-shadow: 2px 2px 0 #ffb6c1;
      margin-bottom: 8px;
      animation: build-title-bounce 1.5s ease-in-out infinite;
    }
    @keyframes build-title-bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    #build-overlay .build-desc {
      font-size: 20px;
      color: #c070a0;
      margin-bottom: 32px;
    }
    #build-overlay .build-gear-wrap {
      margin-bottom: 32px;
    }
    #build-overlay .build-gear {
      width: 80px; height: 80px;
      border: 8px solid #ff69b4;
      border-radius: 50%;
      border-top-color: #ffd700;
      border-right-color: #69b4ff;
      border-bottom-color: #69ff69;
      animation: build-gear-spin 1.5s linear infinite;
    }
    @keyframes build-gear-spin {
      to { transform: rotate(360deg); }
    }
    #build-overlay .build-steps {
      text-align: left;
      margin-bottom: 32px;
      min-width: 350px;
    }
    #build-overlay .build-step {
      font-size: 18px;
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #build-overlay .build-step.done {
      color: rgba(0,0,0,0.3);
    }
    #build-overlay .build-step.done .step-icon {
      color: #69ff69;
    }
    #build-overlay .build-step.active {
      color: #333;
      font-weight: bold;
    }
    #build-overlay .build-step.active .step-icon {
      color: #ff69b4;
      animation: build-step-pulse 0.8s ease-in-out infinite;
    }
    @keyframes build-step-pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #build-overlay .build-step.pending {
      color: rgba(0,0,0,0.2);
    }
    .step-icon { font-size: 20px; width: 24px; text-align: center; }
    #build-overlay .build-bar-wrap {
      width: 50%;
      max-width: 500px;
      height: 14px;
      background: rgba(0,0,0,0.08);
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    #build-overlay .build-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b6b, #ffa500, #ffd700, #69ff69, #69b4ff, #b469ff);
      background-size: 200% 100%;
      animation: build-bar-shimmer 2s linear infinite;
      border-radius: 7px;
      transition: width 0.5s ease;
    }
    @keyframes build-bar-shimmer {
      to { background-position: 200% 0; }
    }
    #build-overlay .build-pct {
      font-size: 16px;
      font-weight: bold;
      color: #ff69b4;
    }
  </style>
  <script>
    // Build overlay — runs independently of Vite modules.
    // Uses sessionStorage to survive page reloads and blocks Vite's
    // reload mechanism during builds so the overlay stays stable.
    (function() {
      var overlay = document.getElementById('build-overlay');
      var nameEl = document.getElementById('build-name');
      var descEl = document.getElementById('build-desc');
      var stepsEl = document.getElementById('build-steps');
      var barEl = document.getElementById('build-bar');
      var pctEl = document.getElementById('build-pct');
      var isBuilding = false;
      var originalReload = location.reload.bind(location);

      // On boot: if sessionStorage says we were building, show overlay INSTANTLY
      // (no fetch delay — covers the gap during Vite page reloads)
      if (sessionStorage.getItem('building') === 'true') {
        overlay.style.display = '';
        isBuilding = true;
        blockReloads();
        // Restore last known content if available
        try {
          var cached = JSON.parse(sessionStorage.getItem('buildData'));
          if (cached) updateDisplay(cached);
        } catch(e) {}
      }

      function blockReloads() {
        // Prevent Vite HMR from reloading the page during builds
        Object.defineProperty(location, 'reload', {
          configurable: true,
          value: function() { /* blocked during build */ }
        });
        // Also block via window — some Vite versions use this
        window.__vite_reload_blocked = true;
      }

      function unblockReloads() {
        Object.defineProperty(location, 'reload', {
          configurable: true,
          value: originalReload
        });
        window.__vite_reload_blocked = false;
      }

      function updateDisplay(data) {
        nameEl.textContent = (data.name || 'Someone') + "'s Change";
        descEl.textContent = data.description || '';

        if (data.steps && data.steps.length) {
          var html = '';
          var doneCount = 0;
          for (var i = 0; i < data.steps.length; i++) {
            var step = data.steps[i];
            var isDone = step.done;
            var isActive = !isDone && (i === 0 || data.steps[i-1].done);
            if (isDone) doneCount++;
            var cls = isDone ? 'done' : (isActive ? 'active' : 'pending');
            var icon = isDone ? '\u2714' : (isActive ? '\u25CF' : '\u25CB');
            html += '<div class="build-step ' + cls + '"><span class="step-icon">' + icon + '</span>' + step.text + '</div>';
          }
          stepsEl.innerHTML = html;
          var pct = Math.round((doneCount / data.steps.length) * 100);
          barEl.style.width = pct + '%';
          pctEl.textContent = pct + '%';
        } else {
          stepsEl.innerHTML = '<div class="build-step active"><span class="step-icon">\u25CF</span>Building...</div>';
          barEl.style.width = '0%';
          pctEl.textContent = '';
        }
      }

      function poll() {
        fetch('/building.json?t=' + Date.now())
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.building) {
              if (!isBuilding) {
                isBuilding = true;
                blockReloads();
              }
              overlay.style.display = '';
              sessionStorage.setItem('building', 'true');
              sessionStorage.setItem('buildData', JSON.stringify(data));
              updateDisplay(data);

              // Hide Vite error overlay if present
              var viteErr = document.querySelector('vite-error-overlay');
              if (viteErr) viteErr.style.display = 'none';
            } else if (isBuilding) {
              // Build just finished — clean reload to pick up all changes
              isBuilding = false;
              sessionStorage.removeItem('building');
              sessionStorage.removeItem('buildData');
              overlay.style.display = 'none';
              unblockReloads();
              // One clean reload to apply all the source changes
              setTimeout(function() { originalReload(); }, 500);
            }
          })
          .catch(function() {
            // keep current state on error
          });
      }

      poll();
      setInterval(poll, 1000);
    })();
  </script>
</body>
</html>
